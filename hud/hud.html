<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ULTRON</title>
<style>
  :root {
    --void: #05060a;
    --iron: #14171d;
    --core-red: #ff2b1f;
    --core-amber: #ffb238;
    --core-gold: #d99a35;
    --core-dim: #4a340f;
    --text-cold: #d8dee6;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--void);
    overflow: hidden;
    font-family: 'Consolas', 'Courier New', monospace;
    color: var(--text-cold);
  }
  #stage {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  #stage::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(217,154,53,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(217,154,53,0.03) 1px, transparent 1px);
    background-size: 34px 34px;
    pointer-events: none;
  }

  .bracket {
    position: absolute; width: 46px; height: 46px;
    border-color: var(--core-dim);
    opacity: 0.55;
  }
  .bracket-tl { top: 14px; left: 14px; border-top: 1px solid; border-left: 1px solid; }
  .bracket-br { bottom: 14px; right: 14px; border-bottom: 1px solid; border-right: 1px solid; }

  .core-wrap {
    position: relative;
    width: 380px; height: 380px;
  }
  .core-wrap::before {
    content: "";
    position: absolute; inset: -60px;
    background: radial-gradient(circle, rgba(217,154,53,0.18) 0%, rgba(217,154,53,0.05) 45%, transparent 72%);
    pointer-events: none;
    transition: background 0.6s ease;
  }
  body[data-state="thinking"] .core-wrap::before,
  body[data-state="speaking"] .core-wrap::before,
  body[data-state="booting"] .core-wrap::before {
    background: radial-gradient(circle, rgba(255,43,31,0.20) 0%, rgba(255,43,31,0.05) 45%, transparent 72%);
  }
  body[data-state="gesture_active"] .core-wrap::before {
    background: radial-gradient(circle, rgba(53,195,255,0.18) 0%, rgba(53,195,255,0.05) 45%, transparent 72%);
  }
  svg { width: 100%; height: 100%; overflow: visible; }

  .burst-scatter { stroke: var(--core-amber); transition: stroke 0.5s ease; }
  .burst-scatter-spin { animation: spin 55s linear infinite reverse; }

  .burst-line { stroke: var(--core-gold); transition: stroke 0.5s ease; }
  .burst-spin { animation: spin 90s linear infinite; }

  .ring { fill: none; stroke: var(--core-dim); transition: stroke 0.4s ease; }
  .ring-outer { stroke-width: 1.5; }
  .ring-mid   { stroke-width: 2; stroke-dasharray: 6 10; }
  .ring-inner { stroke-width: 3; }

  .core-fill {
    fill: var(--core-dim);
    filter: blur(10px);
    transition: fill 0.5s ease, opacity 0.5s ease;
    transform-origin: center;
  }
  .core-glow {
    fill: var(--core-gold);
    opacity: 0.9;
    filter: blur(2px);
    transition: fill 0.5s ease;
    transform-origin: center;
  }

  .spin-slow { animation: spin 18s linear infinite; }
  .spin-rev  { animation: spin 26s linear infinite reverse; }
  .spin-fast { animation: spin 4s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50%      { transform: scale(1.12); opacity: 1; }
  }

  #status-label {
    position: absolute;
    bottom: 14%;
    left: 50%;
    transform: translateX(-50%);
    letter-spacing: 4px;
    font-size: 13px;
    text-transform: uppercase;
    color: var(--core-amber);
    opacity: 0.85;
  }

  #transcript {
    position: absolute;
    bottom: 6%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: rgba(216,222,230,0.55);
    max-width: 70vw;
    text-align: center;
    min-height: 18px;
  }

  body[data-state="idle"] .ring          { stroke: var(--core-gold); opacity: 0.5; }
  body[data-state="idle"] .core-fill,
  body[data-state="idle"] .core-glow     { fill: var(--core-gold); }

  body[data-state="listening"] .ring        { stroke: var(--core-amber); }
  body[data-state="listening"] .core-fill,
  body[data-state="listening"] .core-glow   { fill: var(--core-amber); }

  body[data-state="thinking"] .ring         { stroke: var(--core-red); }
  body[data-state="thinking"] .core-fill,
  body[data-state="thinking"] .core-glow    { fill: var(--core-red); }
  body[data-state="thinking"] .spin-fast    { animation-duration: 1.2s; }

  body[data-state="speaking"] .ring         { stroke: var(--core-red); }
  body[data-state="speaking"] .core-fill,
  body[data-state="speaking"] .core-glow    { fill: var(--core-red); }

  body[data-state="gesture_active"] .ring       { stroke: #35c3ff; }
  body[data-state="gesture_active"] .core-fill,
  body[data-state="gesture_active"] .core-glow  { fill: #35c3ff; }
  body[data-state="gesture_active"] .burst-line { stroke: #35c3ff; }
  body[data-state="gesture_active"] .burst-scatter { stroke: #35c3ff; }

  body[data-state="sentry"] .ring        { stroke: #4ade80; opacity: 0.5; }
  body[data-state="sentry"] .core-fill,
  body[data-state="sentry"] .core-glow   { fill: #4ade80; }
  body[data-state="sentry"] .burst-line,
  body[data-state="sentry"] .burst-scatter { stroke: #4ade80; }
  body[data-state="sentry"] .core-wrap::before {
    background: radial-gradient(circle, rgba(74,222,128,0.18) 0%, rgba(74,222,128,0.05) 45%, transparent 72%);
  }

  #boot-flash {
    position: absolute; inset: 0;
    background: var(--core-red);
    opacity: 0;
    pointer-events: none;
    display: none;
  }
  body[data-state="booting"] #boot-flash {
    display: block;
    animation: boot-flicker 0.9s ease-in-out infinite;
  }
  @keyframes boot-flicker {
    0%, 100% { opacity: 0; }
    50%      { opacity: 0.12; }
  }
  body[data-state="booting"] .ring        { stroke: var(--core-red); }
  body[data-state="booting"] .core-fill,
  body[data-state="booting"] .core-glow   { fill: var(--core-red); }
  body[data-state="booting"] .burst-line  { stroke: var(--core-red); }
  body[data-state="booting"] .burst-scatter { stroke: var(--core-red); }
  body[data-state="booting"] .spin-fast   { animation-duration: 0.6s; }
  body[data-state="booting"] .spin-slow   { animation-duration: 3s; }
  body[data-state="booting"] .spin-rev    { animation-duration: 4s; }
  body[data-state="booting"] .burst-spin  { animation-duration: 8s; }

  #boot-progress {
    position: absolute;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    text-align: center;
    color: var(--core-red);
    letter-spacing: 3px;
  }
  body[data-state="booting"] #boot-progress { display: block; }
  #boot-percent { font-size: 42px; font-weight: bold; }
  #boot-bar-track {
    width: 260px; height: 4px; background: var(--core-dim);
    margin: 10px auto 0; overflow: hidden;
  }
  #boot-bar-fill {
    height: 100%; width: 0%; background: var(--core-red);
    transition: width 0.4s ease;
  }
</style>

<script>
  const body = document.body;
  const label = document.getElementById('status-label');
  const transcript = document.getElementById('transcript');
  const bootPercent = document.getElementById('boot-percent');
  const bootBar = document.getElementById('boot-bar-fill');

  function setState(state, text, progress) {
    body.setAttribute('data-state', state);
    label.textContent = state.replace('_', ' ').toUpperCase();
    if (text !== undefined) transcript.textContent = text;
    if (progress !== undefined && progress !== null) {
      bootPercent.textContent = Math.round(progress) + '%';
      bootBar.style.width = Math.round(progress) + '%';
    }
  }

  function connect() {
    const ws = new WebSocket('ws://localhost:8765');
    ws.onmessage = (evt) => {
      try {
        const data = JSON.parse(evt.data);
        setState(data.state || 'idle', data.text || '', data.progress);
      } catch (e) { /* ignore malformed frames */ }
    };
    ws.onclose = () => setTimeout(connect, 1500);
    ws.onerror = () => ws.close();
  }
  connect();
</script>
